# Run: python launch.py {add,verify} ...  (installs runtime deps on first start)
# Develop: python tasks.py setup  (equivalent to:)
#   python -m venv .venv
#   .venv/Scripts/python -m pip install -r requirements.lock
#   .venv/Scripts/python -m pip install -e . --no-deps

[project]
name = "cdkeys"
version = "0.1.0"
description = "Encrypted (SQLCipher) store for software licence keys"
requires-python = ">=3.12"
dependencies = [
    "sqlcipher3==0.6.2",
]

[project.scripts]
cdkeys = "cdkeys.cli:main"

[project.gui-scripts]
# No console window on Windows.
cdkeys-gui = "cdkeys.gui:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==8.3.3",
    "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tasks.py and launch.py are repo-root scripts, not part of the package.
pythonpath = ["."]
# pytest's default fd-level capture redirects the process's stdio handles,
# and with it Tcl intermittently fails to read its own init.tcl / ttk scripts
# on Windows ("couldn't read file ... No error"), erroring random GUI tests.
# sys-level capture still captures all Python output; 0 failures in repeat
# runs versus roughly half of runs failing with fd capture.
addopts = "--capture=sys"

[tool.ruff]
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting is the test idiom; S101 targets runtime asserts.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "tasks.py", "launch.py"]

[[tool.mypy.overrides]]
# sqlcipher3 0.6.2 ships neither type stubs nor a py.typed marker, and no
# stubs package exists; scope the exemption to that one module.
module = ["sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true

name: CI

on:
  # Every branch: the default branch here is master, not main, and every push
  # should be checked.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The scripts are used on Windows and rely on the sqlcipher3 Windows wheel.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # requirements.lock is resolved for this version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Setup
        run: python tasks.py setup

      # Format check, lint, strict type check and tests; stops at the first
      # failure. Same command as running it locally.
      - name: Check
        run: python tasks.py check
